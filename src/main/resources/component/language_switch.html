<link rel="stylesheet" href="/common/css/theme.css">
<header class="site-header">
    <style>
        .site-header { position: fixed; inset: 0 0 auto; z-index: 1000; background: rgba(255,255,255,.94); border-bottom: 1px solid #dfe6ef; backdrop-filter: blur(14px); }
        .site-header__inner { max-width: 1200px; min-height: 68px; padding: 8px 24px; margin: auto; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
        .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
        .brand-icon { width: 38px; height: 38px; object-fit: contain; }
        .brand-text { color: #233554; font-size: 1.08rem; font-weight: 700; letter-spacing: -.02em; text-decoration: none; }
        .language-switch { display: flex; align-items: center; gap: 10px; }
        .header-home { color: #304a70; font-weight: 600; text-decoration: none; padding: 8px 12px; border-radius: 9px; }
        .header-home:hover { background: #edf2f9; }
        .header-home:focus-visible { outline: 3px solid #729be9; outline-offset: 2px; }
        .language-switch label { color: #5b6b80; font-size: .88rem; }
        .lang-select, .theme-toggle { font: inherit; font-size: .9rem; border: 1px solid #d9e2ed; border-radius: 9px; background: #fff; color: #263a56; padding: 8px 11px; cursor: pointer; }
        .lang-select:focus-visible, .theme-toggle:focus-visible, .brand-text:focus-visible { outline: 3px solid #729be9; outline-offset: 2px; }
        .theme-toggle, .select-wrap { width: 42px; height: 42px; display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box; }
        .theme-toggle { padding: 0; }
        .theme-toggle svg, .language-icon { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
        .theme-sun { display: none; }
        html[data-theme=dark] .theme-moon { display: none; }
        html[data-theme=dark] .theme-sun { display: block; }
        .select-wrap { position: relative; width: 52px; gap: 3px; border: 1px solid #d9e2ed; border-radius: 9px; color: #263a56; background: #fff; }
        .select-wrap .lang-select { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        .select-wrap:focus-within { outline: 3px solid #729be9; outline-offset: 2px; }
        .language-chevron { font-size: 15px; line-height: 1; }
        .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
        html[data-theme=dark] .select-wrap { color: #e1e8f0; background: #202c3b; border-color: #465569; }
        html, body { margin: 0; }
        body { padding-top: 68px; }
        @media (max-width: 560px) {
            .site-header__inner { padding: 8px 14px; gap: 8px; flex-wrap: wrap; justify-content: center; }
            .brand { width: 100%; justify-content: center; }
            .brand-icon { width: 30px; height: 30px; }

            body { padding-top: 100px; }
        }
    </style>

    <div class="site-header__inner">
        <div class="brand">
            <img src="/common/img/course_logo.png" alt="Logo" class="brand-icon">
            <a class="brand-text" data-i18n="COM_logo" href="/index.html"></a>
        </div>
        <nav class="language-switch" aria-label="Site controls">
            <a class="header-home" href="/index.html" data-i18n="nav.home">Home</a>
            <button type="button" id="theme-toggle" class="theme-toggle" aria-pressed="false" aria-label="Switch to dark mode">
                <svg class="theme-moon" aria-hidden="true" viewBox="0 0 24 24"><path d="M20 15.5A8.5 8.5 0 0 1 8.5 4 8.5 8.5 0 1 0 20 15.5Z"/></svg>
                <svg class="theme-sun" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42m0-14.14-1.42 1.42M6.35 17.65l-1.42 1.42"/></svg>
            </button>
            <label class="visually-hidden" for="lang-select" data-i18n="lang select title">Language</label>
            <div class="select-wrap" title="Language">
                <svg class="language-icon" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg><span class="language-chevron" aria-hidden="true">⌄</span>
                <select id="lang-select" class="lang-select" aria-label="Language">
                    <option value="en">English</option>
                    <option value="ja">日本語</option>
                    <option value="zh">简体中文</option>
                    <option value="tc">繁體中文</option>
                </select>
            </div>
        </nav>
    </div>
</header>
