<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
<!--    <meta name="viewport" content="width=device-width, initial-scale=1" />-->
    <title data-i18n="meta.title"></title>
    <style>
        .course-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin: 20px 0;
        }

        .course-grid .chapter-btn {
            width: 100%;
            min-height: 64px;
            border: 0;
            border-radius: 10px;
            font: 600 1rem/1.35 "Source Sans 3", sans-serif;
            color: #304765;
            background: #fff;
            cursor: pointer;
            box-shadow: none;
            background-image: none;
            transition: background-color .18s;
        }
        .course-grid .chapter-btn:hover:not(:disabled) {
            background: #f2f6fb;
            border: 0;
            box-shadow: none;
            background-image: none;
        }
        .course-grid .chapter-btn:active:not(:disabled) { background: #e8eef6; }
        .course-grid .chapter-btn:disabled {
            color: #98a5b5;
            background: #f3f5f8;
            border: 0;
            background-image: none;
            cursor: not-allowed;
            box-shadow: none;
        }
        html[data-theme=dark] .course-grid .chapter-btn {
            color: #e2ebf7;
            background: #202c3b;
            border: 0;
            background-image: none;
            box-shadow: none;
        }
        html[data-theme=dark] .course-grid .chapter-btn:hover:not(:disabled) {
            color: #fff;
            background: #334458;
            border: 0;
            box-shadow: none;
            background-image: none;
        }
        html[data-theme=dark] .course-grid .chapter-btn:disabled {
            color: #8795a8;
            background: #1a2431;
            border: 0;
            background-image: none;
        }
        .course-grid .chapter-btn:focus-visible { outline: 3px solid #6f9edc; outline-offset: 2px; }

    </style>

</head>
<body>
<div id="language-switch"></div>
<div id="course-nav"></div>
<div id="pager"></div>
<main class="container prose mx-auto">
<!--    <h1 data-i18n="intro.title"></h1>-->

    <section id="course-introduction" class="course-intro">
        <h1 data-i18n="intro.title"></h1>

        <p data-i18n="intro.p1"></p>

        <h2 data-i18n="intro.includes.title"></h2>
        <ul class="course-outline">
            <li data-i18n="intro.includes.l1"></li>
            <li data-i18n="intro.includes.l2"></li>
            <li data-i18n="intro.includes.l3"></li>
            <li data-i18n="intro.includes.l4"></li>
            <li data-i18n="intro.includes.l5"></li>
            <li data-i18n="intro.includes.l6"></li>
        </ul>

        <p data-i18n="intro.end"></p>
    </section>

    <section id="course-plan">
        <h2 data-i18n="course_plan.title"></h2>
        <div id="course-buttons"></div>
    </section>
</main>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        fetch("/component/course_buttons.html")   // 后端生成好的静态文件
            .then(res => res.text())
            .then(html => {
                document.getElementById("course-buttons").innerHTML = html;
            })
            .catch(err => console.error("加载按钮失败:", err));
    });
</script>
<script type="module" src="/common/js/course.js?v=10" defer></script>
</body>

</html>
